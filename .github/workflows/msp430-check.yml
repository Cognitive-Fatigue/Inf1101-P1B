name: MSP430 Code Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install MSP430 GCC Toolchain
      uses: meijierik/setup-msp430-gcc@v1

    - name: Compile Assembly Code
      run: |
        msp430-elf-gcc -mmcu=msp430f5529 -nostartfiles -o output.elf watch.asm
